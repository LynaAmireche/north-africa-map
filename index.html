<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Africa's DNA Makeup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    background: #add8e6;
    color: #000000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 20px 20px 12px;
    background: #add8e6;
    border-bottom: 2px solid #000;
  }

  header h1 {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 700;
    color: #000080;
    text-transform: uppercase;
  }

  header p {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 1rem;
    color: #000000;
    margin-top: 6px;
  }

  #layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 80px);
  }

  #map-panel {
    flex: 1 1 65%;
    position: relative;
    background: #add8e6;
    overflow: hidden;
  }

  #base-map {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Overlay sits on top of map, same size as panel */
  #pin-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .pin {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #cc0000;
    border: 2.5px solid #000;
    border-radius: 50%;
    /* center the circle on the coordinate */
    transform: translate(-50%, -50%);
    cursor: pointer;
    pointer-events: all;
    transition: background 0.2s, transform 0.15s;
  }

  .pin:hover, .pin.active {
    background: #000000;
    transform: translate(-50%, -50%) scale(1.35);
  }

  #sidebar {
    flex: 0 0 360px;
    background: #c5e8f5;
    border-left: 2px solid #000;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 20px 18px;
    gap: 16px;
  }

  #btn-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .place-btn {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 10px 14px;
    border-radius: 6px;
    border: 2px solid #000000;
    cursor: pointer;
    text-align: left;
    transition: opacity 0.2s;
    color: #ffffff;
  }

  .place-btn:nth-child(odd)  { background: #000000; }
  .place-btn:nth-child(even) { background: #cc0000; }

  .place-btn:hover { opacity: 0.78; }
  .place-btn.active { outline: 3px solid #000080; outline-offset: 2px; }

  #story-card {
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 8px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #story-card h2 {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 1.05rem;
    font-weight: 700;
    color: #000080;
    border-bottom: 1px solid #000;
    padding-bottom: 8px;
    line-height: 1.4;
  }

  #story-card p {
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 0.9rem;
    line-height: 1.8;
    color: #000000;
    white-space: pre-wrap;
  }

  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 10px;
    text-align: center;
    color: #333;
    font-size: 0.9rem;
  }

  #placeholder .icon { font-size: 2rem; }

  @media (max-width: 680px) {
    #layout { flex-direction: column; height: auto; }
    #sidebar { flex: none; border-left: none; border-top: 2px solid #000; }
    #map-panel { min-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <h1>North Africa's DNA Makeup</h1>
  <p>Click on any button to see the full genetic makeup of the population of the city</p>
</header>

  const natW    = img.naturalWidth  || 1349;

  // object-fit: contain — image is scaled to fit inside panel, centred,
  // with empty space (letterbox) on whichever axis has leftover room.
  const scale  = Math.min(panelW / natW, panelH / natH);
  const rendW  = natW * scale;
  const rendH  = natH * scale;
  const offX   = (panelW - rendW) / 2;   // horizontal letterbox offset
  const offY   = (panelH - rendH) / 2;   // vertical letterbox offset

  layer.innerHTML = '';   // clear old pins

  PIN_DATA.forEach(p => {
    const dot       = document.createElement('div');
    dot.className   = 'pin';
    dot.dataset.id  = p.id;
    // Convert image-% to panel pixels, then add letterbox offset
    dot.style.left  = (offX + rendW * p.px / 100) + 'px';
    dot.style.top   = (offY + rendH * p.py / 100) + 'px';
    dot.onclick     = () => showStory(p.id);
    layer.appendChild(dot);
  });
}

// Run on load and whenever the window resizes
window.addEventListener('load', placePins);
window.addEventListener('resize', placePins);
document.getElementById('base-map').addEventListener('load', placePins);

const ORDER = ['carthage', 'kabylie', 'luxor', 'djanet', 'fez'];

function showStory(id) {
  const data = stories[id];
  if (!data) return;

  document.getElementById('placeholder').style.display = 'none';

  const titleEl = document.getElementById('story-title');
  const textEl  = document.getElementById('story-text');
  titleEl.textContent = data.title;
  titleEl.style.display = '';
  textEl.textContent = data.text;

  // Highlight correct pin
  document.querySelectorAll('.pin').forEach(p => p.classList.remove('active'));
  const activePin = document.querySelector(`.pin[data-id="${id}"]`);
  if (activePin) activePin.classList.add('active');

  // Highlight correct button
  document.querySelectorAll('.place-btn').forEach(b => b.classList.remove('active'));
  const idx = ORDER.indexOf(id);
  if (idx !== -1) document.querySelectorAll('.place-btn')[idx].classList.add('active');
}
